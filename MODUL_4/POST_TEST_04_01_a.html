<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Post-Test 1a</title>
</head>
<body>
  <script>
    function contohScope() {
      if (true) {
        var a = "var";
        let b = "let";
        const c = "const";
      }

      console.log("a = " + a + "  (var bisa diakses di luar blok)");

      try {
        console.log(b);
      } catch (e) {
        console.log("b -> " + e.name + ": " + e.message);
      }

      try {
        console.log(c);
      } catch (e) {
        console.log("c -> " + e.name + ": " + e.message);
      }
    }

    contohScope();
  </script>
</body>
